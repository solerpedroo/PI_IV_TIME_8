<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safras | AgroGestão</title><link rel="stylesheet" href="styles/base.css"><link rel="stylesheet" href="styles/shell.css"><link rel="stylesheet" href="styles/modules.css"></head>
<body><main class="main-content"><header class="page-header"><div><h1>Safras</h1><p>Acompanhe ciclos produtivos, etapas e registros da propriedade.</p></div><button class="btn btn-primary" type="button" data-new-safra>Nova safra</button></header>
<section class="card"><div class="card-header"><h2 class="card-title">Ciclos produtivos</h2><select data-filter-stage aria-label="Filtrar etapa"><option value="">Todas as etapas</option><option>Planejamento</option><option>Preparação</option><option>Plantio</option><option>Manejo</option><option>Colheita</option><option>Finalização</option></select></div><div data-safras-list></div><div class="empty-state" data-safras-empty hidden><h3>Nenhuma safra encontrada</h3><p>Crie um ciclo para acompanhar a produção.</p></div></section></main>
<div class="modal-backdrop" data-modal="safra-form" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="safra-form-title"><h2 id="safra-form-title">Nova safra</h2><form class="stack-form" data-safra-form novalidate><div class="input-group"><label for="safra-nome">Nome *</label><input id="safra-nome" name="nome" required><p class="field-error" data-error-for="nome"></p></div><div class="form-grid-2"><div class="input-group"><label for="safra-cultura">Cultura *</label><select id="safra-cultura" name="cultura" required><option value="">Selecione</option><option>Soja</option><option>Milho</option><option>Trigo</option><option>Café</option></select></div><div class="input-group"><label for="safra-talhao">Talhões *</label><select id="safra-talhao" name="talhoes" multiple required></select><small>Use Ctrl/Cmd para selecionar mais de um.</small><p class="field-error" data-error-for="talhoes"></p></div></div><div class="form-grid-2"><div class="input-group"><label for="safra-inicio">Início *</label><input id="safra-inicio" name="dataInicio" type="date" required></div><div class="input-group"><label for="safra-fim">Término *</label><input id="safra-fim" name="dataFim" type="date" required></div></div><div class="modal-actions"><button class="btn btn-outline" type="button" data-close-safra>Cancelar</button><button class="btn btn-primary" type="submit">Criar ciclo</button></div></form></div></div>
<script src="scripts/toast.js"></script><script src="scripts/safras.js"></script></body></html>
