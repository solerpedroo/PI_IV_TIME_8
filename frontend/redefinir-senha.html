<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Defina uma nova senha para sua conta no AgroGestão.">
  <link rel="icon" type="image/svg+xml" href="Assets/brand/favicon.svg">
  <title>Redefinir senha - AgroGestão</title>
  <!-- Tipografia Geist carregada em styles/base.css (@font-face Fontsource) -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/motion.css">
</head>
<body>
  <!--
    Tela: Redefinir Senha (frame c5ewZM)
    Layout: brand (sprout) + card 440px com medidor de força
  -->
  <main class="auth-main auth-main--flush">
    <div class="center-stack center-stack--reset">

      <!-- Branding -->
      <div class="center-brand">
        <div class="brand-lockup brand-lockup--compact">
          <span class="brand-mark brand-mark--logo" aria-hidden="true">
            <img class="brand-img" src="Assets/brand/simbolo.svg" alt="" width="48" height="48">
          </span>
          <span>
            <span class="brand-name">Agro<span class="brand-name-light">Gestão</span></span>
            <span class="brand-caption">Gestão agrícola inteligente</span>
          </span>
        </div>
      </div>

      <!-- Reset card -->
      <section class="verify-card auth-card--reset" aria-labelledby="reset-title">
        <header class="auth-header">
          <h2 id="reset-title">Redefinir senha</h2>
          <p>Crie uma nova senha segura para acessar sua conta.</p>
        </header>

        <form
          class="auth-form"
          data-auth-form
          data-auth-route="/api/auth/reset-password"
          data-success-route="login.html"
          data-flash-message="Senha redefinida com sucesso. Faça login com a nova senha."
          novalidate
        >
          <!-- O token vem do e-mail de recuperação ou pode ser colado manualmente. -->
          <div class="input-group input-group--otp">
            <span class="label" id="otp-reset-label">Código de redefinição</span>
            <div class="otp-inputs" data-otp-inputs role="group" aria-labelledby="otp-reset-label">
              <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="one-time-code" data-otp-digit aria-label="Dígito 1">
              <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-otp-digit aria-label="Dígito 2">
              <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-otp-digit aria-label="Dígito 3">
              <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-otp-digit aria-label="Dígito 4">
              <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-otp-digit aria-label="Dígito 5">
              <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-otp-digit aria-label="Dígito 6">
            </div>
            <input type="hidden" name="token" id="token" value="" required data-required-message="Informe o código de 6 dígitos.">
            <span class="field-error" data-otp-error aria-live="polite"></span>
          </div>

          <div class="input-group">
            <label for="password">Nova senha</label>
            <div class="input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                data-password
                data-password-meter
                autocomplete="new-password"
                placeholder="Digite sua nova senha"
                maxlength="128"
                required
                data-required-message="Crie uma nova senha."
              >
              <button
                class="password-toggle"
                type="button"
                data-password-toggle="password"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <span data-toggle-label>Mostrar</span>
              </button>
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <!-- Força da senha (5 segmentos + regras do servidor) -->
          <div class="password-meter" data-meter data-level="0" aria-live="polite">
            <div class="password-meter-header">
              <span>Força da senha</span>
              <span class="password-meter-label" data-meter-label data-level="0">—</span>
            </div>
            <div class="password-meter-bar" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="password-rules">
              <span data-rule="length">Mínimo de 8 caracteres</span>
              <span data-rule="upper">Pelo menos uma letra maiúscula</span>
              <span data-rule="number">Pelo menos um número</span>
              <span data-rule="symbol">Pelo menos um caractere especial</span>
              <span data-rule="max">No máximo 128 caracteres</span>
            </div>
          </div>

          <div class="input-group">
            <label for="password-confirm">Confirmar senha</label>
            <div class="input-wrap">
              <input
                id="password-confirm"
                name="password-confirm"
                type="password"
                data-password-confirm
                autocomplete="new-password"
                placeholder="Digite novamente sua nova senha"
                maxlength="128"
                required
                data-required-message="Confirme sua senha."
              >
              <button
                class="password-toggle"
                type="button"
                data-password-toggle="password-confirm"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <span data-toggle-label>Mostrar</span>
              </button>
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <div data-form-message class="form-message"></div>

          <button class="btn btn-primary btn-block" type="submit">Redefinir senha</button>
        </form>
      </section>

      <a class="auth-link" href="login.html">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
        Voltar ao login
      </a>
    </div>
  </main>

  <script src="scripts/fetch-timeout.js" defer></script>
  <script src="scripts/senha-regras.js" defer></script>
  <script src="scripts/auth.js" defer></script>
</body>
</html>
