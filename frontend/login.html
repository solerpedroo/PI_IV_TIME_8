<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse o Agro para acompanhar sua gestão rural.">
  <link rel="icon" type="image/svg+xml" href="Assets/brand/favicon.svg">
  <title>Entrar - AgroGestão</title>
  <!-- Tipografia Geist carregada em styles/base.css (@font-face Fontsource) -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/feedback.css">
  <link rel="stylesheet" href="styles/motion.css">
</head>
<body>
  <!--
    Tela: Login (frame H1j1X do design system)
    Layout: Brand Panel (esquerda) + Form Panel (direita)
  -->
  <main class="auth-shell">

    <!-- Brand panel -->
    <aside class="auth-aside" aria-hidden="false">
      <div class="auth-aside-inner">
        <div class="brand-lockup">
          <span class="brand-mark brand-mark--logo" aria-hidden="true">
            <img class="brand-img" src="Assets/brand/simbolo-claro.svg" alt="" width="48" height="48">
          </span>
          <span>
            <span class="brand-name">Agro<span class="brand-name-light">Gestão</span></span>
            <span class="brand-caption">Gestão Agrícola</span>
          </span>
        </div>
        <h1>Gestão integrada da sua propriedade rural</h1>
        <p>Planeje cultivo, controle insumos, registre atividades e acompanhe custos em uma única plataforma.</p>
      </div>
    </aside>

    <!-- Form panel -->
    <section class="auth-main" aria-labelledby="login-title">
      <div class="auth-card">
        <header class="auth-header">
          <h2 id="login-title">Entrar</h2>
          <p>Acesse sua conta para continuar</p>
        </header>

        <form
          class="auth-form"
          data-auth-form
          data-auth-route="/api/auth/login"
          data-success-route="dashboard.html"
          data-flash-message="Entrada realizada com sucesso. Bem-vindo ao Agro."
          novalidate
        >
          <div class="input-group">
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
              data-required-message="Informe seu e-mail."
            >
            <span class="field-error" aria-live="polite"></span>
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <div class="input-wrap">
              <input
                id="password"
                name="password"
                data-password
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
                data-required-message="Informe sua senha."
              >
              <button
                class="password-toggle"
                type="button"
                data-password-toggle="password"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <span data-toggle-label>Mostrar</span>
              </button>
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <div class="form-actions form-actions--end">
            <a class="auth-link" href="recuperar-senha.html">Esqueceu a senha?</a>
            <a class="auth-link" href="confirmar-email.html">Confirmar e-mail</a>
          </div>

          <div data-form-message class="form-message"></div>

          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>

        <footer class="auth-footer">
          Não tem uma conta? <a href="criar-conta.html">Criar conta</a>
        </footer>
      </div>
    </section>
  </main>

  <script src="scripts/fetch-timeout.js" defer></script>
  <script src="scripts/toast.js" defer></script>
  <script src="scripts/auth.js" defer></script>
</body>
</html>
