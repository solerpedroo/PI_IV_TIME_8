services:
  mongo:
    image: mongo:8.0.32
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Um membro local suporta as transações de cadastro e estoque.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}); } db.hello().isWritablePrimary ? quit(0) : quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
