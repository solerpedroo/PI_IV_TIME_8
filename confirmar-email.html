<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confirme seu e-mail para ativar sua conta Agro.">
  <title>Confirmar e-mail — Agro</title>
  <!-- Tipografia Geist carregada em styles/base.css (@font-face Fontsource) -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/motion.css">
</head>
<body>
  <!--
    Tela: Confirmar E-mail (frame DEqXw)
    Layout: Brand Panel (sprout) + card de confirmação 440px
    O e-mail exibido vem de ?email= ou sessionStorage (definido no cadastro).
  -->
  <main class="auth-shell">

    <!-- Brand panel -->
    <aside class="auth-aside auth-aside--confirm">
      <div class="auth-aside-inner">
        <div class="brand-sprout" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 20h10"/>
            <path d="M10 20c5.5-2.5.8-6.4 3-10"/>
            <path d="M9.5 9.4c1.7.8 2.9 2.6 3.5 4.6.9-1.8 2.4-3.2 4.2-3.8-1.6-.5-3.2.2-4.3 1.3-1.3-2.1-3.2-3.4-5.4-3.7 1.5.6 2.4 1.8 2 1.6z"/>
          </svg>
        </div>
        <p class="brand-title">Agro</p>
        <p>Quase lá! Confirme seu e-mail para começar a gerenciar sua propriedade rural.</p>
      </div>
    </aside>

    <!-- Confirm panel -->
    <section class="auth-main" aria-labelledby="verify-title">
      <div class="auth-card auth-card--reset">
        <div class="verify-card verify-card--padded">
          <div class="verify-icon" aria-hidden="true">
            <!-- Lucide: mail -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </div>

          <h2 id="verify-title">Confirme seu e-mail</h2>
          <p>
            Enviamos um link de confirmação para
            <strong id="email-placeholder">seu e-mail</strong>.
            Acesse sua caixa de entrada e clique no link para ativar sua conta.
          </p>

          <div class="verify-actions">
            <!-- Em produção, este botão pode abrir o cliente de e-mail (mailto:) -->
            <a class="btn btn-primary btn-block" href="mailto:">Abrir e-mail</a>
            <button class="btn btn-outline btn-block" type="button" data-resend>
              Reenviar link
            </button>
          </div>

          <a class="auth-link" href="login.html">Voltar ao login</a>
        </div>
      </div>
    </section>
  </main>

  <script src="scripts/auth.js" defer></script>
</body>
</html>
