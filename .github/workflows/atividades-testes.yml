name: Atividades Java e MongoDB
on:
  pull_request:
    paths:
      - 'backend/servidor/**'
      - 'frontend/scripts/atividades.js'
      - 'frontend/atividades.html'
      - 'tests/atividades-reinicio.cjs'
      - 'tests/atividades-real.cjs'
      - 'compose.yaml'
      - '.github/workflows/atividades-testes.yml'
permissions:
  contents: read
jobs:
  atividades:
    # O MongoDB do projeto não inicia com o kernel 6.19 do ubuntu-latest.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar e testar servidor
        run: sh backend/servidor/testar.sh
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Validar navegador com servidor em memória
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/atividades-real.cjs
      - name: Iniciar MongoDB de teste
        run: docker compose up -d --wait mongo
      - name: Validar histórico após reinício e concorrência
        run: node tests/atividades-reinicio.cjs
      - name: Diagnóstico do MongoDB
        if: failure()
        run: docker compose logs mongo
      - name: Encerrar serviço de teste
        if: always()
        run: docker compose down
