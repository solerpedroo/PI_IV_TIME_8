# Autor: Pedro André do Carmo Chavier - RA: 25018639
name: Manutenção Java, socket e navegador
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/manutencao.html'
      - 'frontend/scripts/manutencao.js'
      - 'frontend/styles/manutencao.css'
      - 'frontend/scripts/custos.js'
      - 'tests/manutencao-real.cjs'
      - '.github/workflows/manutencao-testes.yml'
permissions:
  contents: read
jobs:
  manutencao:
    # MongoDB 8 nao inicia no kernel do runner mais recente.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Testar algoritmos do serversocket
        run: sh backend/serversocket/testar.sh
      - name: Compilar e testar servidor
        run: sh backend/api/testar.sh
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Subir serversocket
        run: |
          sh backend/serversocket/compilar.sh
          (cd backend/serversocket && nohup java -cp bin Servidor 3000 > /tmp/socket.log 2>&1 &)
          sleep 1
      - name: Validar manutencao e custo com servidor em memoria
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/manutencao-real.cjs
      - name: Iniciar MongoDB como replica set
        run: docker compose up -d --wait mongo
      - name: Testar manutencao no MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/agro_manutencao_ci_teste?replicaSet=rs0&serverSelectionTimeoutMS=5000
          SERVIDOR_ALGORITMOS_PORT: '3000'
        run: |
          cd backend/api
          java -cp 'bin:lib/*' TesteManutencao --mongo
      - name: Log do serversocket
        if: failure()
        run: cat /tmp/socket.log || true
      - name: Encerrar banco de testes
        if: always()
        run: docker compose down
