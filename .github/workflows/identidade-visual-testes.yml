name: Identidade visual no navegador
on:
  pull_request:
    paths:
      - 'frontend/Assets/brand/**'
      - 'frontend/*.html'
      - 'frontend/partials/**'
      - 'frontend/styles/**'
      - 'tests/identidade-visual-real.cjs'
      - 'docs/identidade-visual.md'
      - '.github/workflows/identidade-visual-testes.yml'
permissions:
  contents: read
jobs:
  identidade-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Validar simbolo, favicon e nome nas telas
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/identidade-visual-real.cjs
