name: Calendario Java e navegador
on:
  pull_request:
    paths:
      - 'backend/servidor/**'
      - 'frontend/scripts/atividades.js'
      - 'frontend/atividades.html'
      - 'frontend/styles/atividades.css'
      - 'tests/calendario-real.cjs'
      - '.github/workflows/calendario-testes.yml'
permissions:
  contents: read
jobs:
  calendario:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar e testar servidor
        run: sh backend/servidor/testar.sh
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Validar calendario com servidor em memoria
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/calendario-real.cjs
