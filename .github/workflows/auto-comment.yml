name: Auto Comment on Issue - Pedro Soler
on:
  issues:
    types: [opened]
jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comentar automaticamente
        uses: actions/github-script@v7
        with:
          script: |
            // Comentário 1: Atualização de Desenvolvimento
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🧾 Atualização de Desenvolvimento
            
            Tempo estimado de desenvolvimento:
            
            Tempo real:
            
            Iniciado:
            
            Finalizado:
            
            ---
            
            ### 📝 Breves anotações:
            -
            
            ---
            
            ### 🚧 Pendências / Travas:
            -
            
            ---
            
            ### 🚀 Extras / Próximos Passos:
            -
            
            ---
            ### 💻 **Quem irá revisar essa task?** (Mandar mensagem no grupo para verificar quem está disponível para a revisão e marcar a pessoa abaixo com @)
            -
            ---
            
            _Este comentário foi gerado automaticamente pelo workflow de Pedro Soler._`
            })

            // Comentário 2: Review
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 Review

            ### 📋 Descrição do Review:
            
            
            ---
            
            ### ✅ Checklist de Review:
            - [ ] Código legível e bem estruturado
            - [ ] Lógica implementada corretamente
            - [ ] Sem quebras ou regressões
            - [ ] Testes contemplados (se aplicável)
            - [ ] Figma coerente com o design system do projeto (se aplicável)
            
            ---
            
            ### 💬 Observações do Revisor:
            -
            
            ---
            
            ### 📌 Status do Review:
            - [ ] Aprovado ✅
            - [ ] Aprovado com ressalvas ⚠️
            - [ ] Reprovado ❌
            
            ---
            
            _Este comentário foi gerado automaticamente pelo workflow de Pedro Soler._`
            })
