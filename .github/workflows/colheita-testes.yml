# Autor: Tomas de Paula Michelon Toniato - RA: 25004211
name: Colheita Java e navegador
on:
  pull_request:
    paths:
      - 'backend/servidor/**'
      - 'frontend/scripts/colheitas.js'
      - 'frontend/styles/colheitas.css'
      - 'frontend/safras.html'
      - 'tests/colheita-real.cjs'
      - '.github/workflows/colheita-testes.yml'
permissions:
  contents: read
jobs:
  colheita:
    # MongoDB 8 nao inicia no kernel do runner mais recente.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compilar e testar servidor
        run: sh backend/servidor/testar.sh
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install chromium --with-deps
      - name: Validar colheita com servidor em memória
        env:
          PLAYWRIGHT_MODULE: playwright
        run: node tests/colheita-real.cjs
      - name: Iniciar MongoDB como replica set
        run: docker compose up -d --wait mongo
      - name: Testar colheita no MongoDB
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/agro_colheitas_ci_teste?replicaSet=rs0&serverSelectionTimeoutMS=5000
        run: |
          cd backend/servidor
          java -cp 'bin:lib/*' TesteColheitas --mongo
      - name: Encerrar banco de testes
        if: always()
        run: docker compose down
