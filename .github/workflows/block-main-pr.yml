name: Block PRs to Main

on:
  pull_request_target:
    types: [opened, reopened, edited]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Close unauthorized PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Pull Requests targeting main are not allowed. Please target the development branch."
