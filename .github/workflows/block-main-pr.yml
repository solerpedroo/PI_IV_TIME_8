
name: Protect Main Pull Requests

on:
  pull_request_target:
    types: [opened, reopened, edited]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  close-unauthorized-pr:
    if: github.event.pull_request.user.login != 'solerpedroo'
    runs-on: ubuntu-latest

    steps:
      - name: Close unauthorized Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "Only @solerpedroo is authorized to open Pull Requests targeting the main branch. Please target the develop branch instead."
