name: ServerSocket de algoritmos
on:
  pull_request:
    paths:
      - 'backend/serversocket/**'
      - '.github/workflows/serversocket-testes.yml'
permissions:
  contents: read
jobs:
  serversocket:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar e testar ServerSocket
        run: sh backend/serversocket/testar.sh
